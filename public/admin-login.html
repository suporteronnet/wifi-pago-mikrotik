<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Wi‑Fi Total</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#091426;color:#e2e8f0;font:16px Arial}form{width:min(360px,90vw);padding:28px;border:1px solid #26364d;border-radius:14px;background:#0f1b2e;display:grid;gap:12px}input,button{padding:12px;border-radius:8px;border:1px solid #334155;font:inherit}button{background:#2563eb;color:white;font-weight:700;cursor:pointer}.error{color:#fca5a5}</style></head><body><form id="login"><h2>Wi‑Fi Total</h2><input id="username" placeholder="Usuário" required><input id="password" type="password" placeholder="Senha" required><button>Entrar</button><div id="error" class="error"></div></form><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(r.ok&&d.ok)location.href='/admin.html';else error.textContent=d.error||'Falha no login';});</script></body></html>
