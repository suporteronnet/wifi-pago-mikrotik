<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>WI-FI TOTAL</title>
  <link rel="stylesheet" href="/ads-stories.css?v=20260922-custom-logo">
  <script src="/ads-destination.js?v=20260922-custom-logo" defer></script>
</head>
<body data-experience="light"><main>
  <header class="portal-brand"><img src="/wifi-total-mark.svg" alt="WI-FI TOTAL" width="144" height="144"></header>
  <section class="card">
    <h1 id="title">Conectando você</h1>
    <p id="status" role="status">Aguarde a confirmação do seu acesso para abrir a oferta.</p>
    <div id="browserHelp" hidden>
      <p>Para abrir o WhatsApp ou site, continue no Safari ou Chrome antes de liberar o Wi-Fi. Use “Abrir no navegador” no menu desta janela ou copie o endereço abaixo e cole no navegador.</p>
      <label>Endereço para continuar<input id="browserUrl" readonly aria-label="Endereço para continuar no navegador"></label>
      <button id="copyUrl" type="button">Copiar endereço</button>
      <button id="browserReady" type="button">Já estou no navegador — conectar</button>
    </div>
    <a id="destination" class="button" rel="noreferrer" hidden>Abrir oferta</a>
    <button id="retry" type="button" hidden>Verificar acesso novamente</button>
  </section>
</main></body>
</html>
