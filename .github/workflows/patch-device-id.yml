name: Patch persistent HotSpot device ID

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-device-id.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch admin login generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/admin.html')
          text = path.read_text(encoding='utf-8')

          marker = '''  var routerKey =
    "${routerKey}";

  var portal =
    "https://wifi-pago-mikrotik-production-44d5.up.railway.app/";'''

          replacement = '''  var routerKey =
    "${routerKey}";

  // Identidade persistente do aparelho no dominio local do HotSpot.
  // Nao depende do MAC privado e sobrevive ao roaming/troca de MAC.
  function createDeviceId(){
    try{
      if(
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
      ){
        return "dev_" + window.crypto.randomUUID();
      }
    }
    catch(error){
    }

    return (
      "dev_" +
      new Date().getTime().toString(36) +
      "_" +
      Math.random().toString(36).slice(2) +
      Math.random().toString(36).slice(2)
    );
  }

  function getDeviceId(){
    var key = "wifi_pago_device_id";

    try{
      var value = localStorage.getItem(key);

      if(!value){
        value = createDeviceId();
        localStorage.setItem(key,value);
      }

      return value;
    }
    catch(error){
      return createDeviceId();
    }
  }

  var deviceId = getDeviceId();

  var portal =
    "https://wifi-pago-mikrotik-production-44d5.up.railway.app/";'''

          if marker not in text:
              raise SystemExit('ERRO: marcador do gerador login.html nao encontrado')

          text = text.replace(marker, replacement, 1)

          marker2 = '''    "&router_key=" +
    encodeURIComponent(routerKey) +

    "&t=" +
    new Date().getTime();'''

          replacement2 = '''    "&router_key=" +
    encodeURIComponent(routerKey) +

    "&device_id=" +
    encodeURIComponent(deviceId) +

    "&t=" +
    new Date().getTime();'''

          if marker2 not in text:
              raise SystemExit('ERRO: montagem da URL do login.html nao encontrada')

          text = text.replace(marker2, replacement2, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- public/admin.html; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin.html
          git commit -m "fix: persist device id across private MAC changes"
          git push origin main
